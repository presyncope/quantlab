[project]
name = "quantlab"
version = "0.1.0"
description = "Local Phase 1 Korean-market premarket research and review MVP"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.30",
  "pandas>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
